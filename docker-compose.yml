services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  gateway:
    build: ./gateway
    ports:
      - "${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
    environment:
      NATS_URL: nats://nats:4222
      DATABASE_URL: postgresql://${POSTGRES_USER:-equisentinel}:${POSTGRES_PASSWORD:-equisentinel}@postgres:5432/${POSTGRES_DB:-equisentinel}
      HTTP_PORT: ${HTTP_PORT:-8080}
      PRICE_CHANGE_THRESHOLD_PCT: ${PRICE_CHANGE_THRESHOLD_PCT:-3.0}
      VOLUME_RATIO_THRESHOLD: ${VOLUME_RATIO_THRESHOLD:-5.0}
      CRITICAL_PRICE_CHANGE_PCT: ${CRITICAL_PRICE_CHANGE_PCT:-5.0}
      DEBOUNCE_WINDOW_SECONDS: ${DEBOUNCE_WINDOW_SECONDS:-30}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:4173}
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${HTTP_PORT:-8080}/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    stop_grace_period: 30s

  simulator:
    build: ./simulator
    environment:
      NATS_URL: nats://nats:4222
      CANDLE_INTERVAL_SECONDS: ${CANDLE_INTERVAL_SECONDS:-2}
      TICKS_PER_CANDLE: ${TICKS_PER_CANDLE:-5}
      SIM_RANDOM_SEED: ${SIM_RANDOM_SEED:-}
      SIMULATOR_HTTP_PORT: ${SIMULATOR_HTTP_PORT:-8082}
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${SIMULATOR_HTTP_PORT:-8082}/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    stop_grace_period: 30s

  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-equisentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-equisentinel}
      POSTGRES_DB: ${POSTGRES_DB:-equisentinel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-equisentinel}"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  ai-worker:
    build: ./ai-worker
    environment:
      NATS_URL: nats://nats:4222
      DATABASE_URL: postgresql://${POSTGRES_USER:-equisentinel}:${POSTGRES_PASSWORD:-equisentinel}@postgres:5432/${POSTGRES_DB:-equisentinel}
      REDIS_URL: redis://redis:6379
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-equisentinel}
      AI_WORKER_HTTP_PORT: ${AI_WORKER_HTTP_PORT:-8081}
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${AI_WORKER_HTTP_PORT:-8081}/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    stop_grace_period: 30s

  etl:
    build: ./etl
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-equisentinel}:${POSTGRES_PASSWORD:-equisentinel}@postgres:5432/${POSTGRES_DB:-equisentinel}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-equisentinel}:${POSTGRES_PASSWORD:-equisentinel}@postgres:5432/${POSTGRES_DB:-equisentinel}
      WAREHOUSE_DATABASE_URL: ${WAREHOUSE_DATABASE_URL:-postgresql://${POSTGRES_USER:-equisentinel}:${POSTGRES_PASSWORD:-equisentinel}@postgres:5432/${POSTGRES_DB:-equisentinel}}
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8090}:8080"
    volumes:
      - etl_airflow_home:/app/airflow_home
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    stop_grace_period: 30s

volumes:
  nats_data:
  postgres_data:
  redis_data:
  etl_airflow_home:
